version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: udyogsetu_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: udyogsetu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: udyogsetu_backend
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/udyogsetu?schema=public"
      JWT_SECRET: "udyogsetu_production_jwt_secret_token_12345"
      STORAGE_PATH: "./uploads"
      CLIENT_URL: "http://localhost:5173"
      NODE_ENV: "production"
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: udyogsetu_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  pgdata:
